<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <div class="header-row">
      <h1 class="game-title">TETRIS</h1>
      <label class="theme-toggle" title="Cambiar tema claro/oscuro">
        <span class="theme-icon">🌙</span>
        <input type="checkbox" id="theme-toggle-input" />
        <span class="toggle-track"><span class="toggle-thumb"></span></span>
        <span class="theme-icon">☀️</span>
      </label>
    </div>
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd> pausa</li>
          </ul>
        </div>

        <div class="panel-section records">
          <span class="label">RECORDS</span>
          <ol id="highscore-list" class="highscore-list"></ol>
          <div class="highscore-stats">
            <span>Mejor combo: <strong id="best-combo-value">0</strong></span>
            <span>Máx. líneas: <strong id="max-lines-value">0</strong></span>
          </div>
          <button id="reset-scores-btn">Resetear records</button>
        </div>
      </aside>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>
        <div id="name-input-box" class="name-input-box hidden">
          <p class="name-input-label">¡Nuevo récord! Escribe tu nombre:</p>
          <input type="text" id="player-name-input" maxlength="12" placeholder="Anónimo" />
          <button id="save-score-btn">Guardar</button>
        </div>
        <div id="overlay-highscores" class="overlay-highscores">
          <ol id="overlay-highscore-list" class="highscore-list"></ol>
        </div>
        <button id="restart-btn">Reiniciar</button>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
